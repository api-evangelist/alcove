aid: alcove
name: Alcove
description: Alcove is an AI-powered procurement and project management platform built for interior
  designers, contractors, event planners, and purchasing agents. It consolidates product details,
  quotes, financials, and order tracking into a single hub, automatically tracking orders across
  vendors and projects, managing tasks and timelines, calculating profitability and markups, and
  offering a purchasing service with Designer Net discounts. An AI assistant surfaces financial
  insights, suggests markups, reviews approvals, and powers filtering. Alcove is a Menlo Ventures
  portfolio company. As of this enrichment pass it publishes a marketing site and web application but
  no public API, developer documentation, or SDKs.
